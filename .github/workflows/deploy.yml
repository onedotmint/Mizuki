name: CI/CD Pipeline

on:
    push:
        branches: [master]
    repository_dispatch:
        types: [content-updated]
    workflow_dispatch:

jobs:
    check-and-build:
        name: 🛡️ 预检阶段 (Build Check)
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 10.33.0

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm

            - name: Install & Test Build
              # 💡 这里如果挂了，GitHub 会用红色高亮标出具体的错误行
              run: |
                  pnpm install
                  pnpm run build
              env:
                  ENABLE_CONTENT_SYNC: false
                  # 如果你的构建脚本需要密钥，这里也得加上，否则脚本会执行失败
