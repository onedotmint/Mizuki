name: CI/CD Pipeline

on:
    push:
        branches: [master]
    repository_dispatch:
        types: [content-updated]
    workflow_dispatch:

jobs:
    check-and-build:
        name: 🛡️ 预检阶段 (Build Check)
        runs-on: ubuntu-latest

        steps:
            - name: Checkout Code
              uses: actions/checkout@v5

            - name: Setup Node.js 24
              uses: actions/setup-node@v5
              with:
                  node-version: 24
                  cache: pnpm

            - name: Enable pnpm
              run: |
                  corepack enable
                  corepack prepare pnpm@10.33.0 --activate
                  pnpm --version

            - name: Install & Prepare Mock Content
              run: |
                  pnpm install --no-frozen-lockfile

                  mkdir -p src/content/posts
                  cat > src/content/posts/placeholder.md <<'EOF'
                  ---
                  title: Placeholder
                  published: 2026-01-01
                  description: Placeholder
                  image: ''
                  tags: []
                  category: Placeholder
                  draft: false
                  ---
                  Content
                  EOF

                  mkdir -p src/content/spec

                  cat > src/content/spec/about.md <<'EOF'
                  ---
                  title: About
                  ---
                  EOF

                  cat > src/content/spec/friends.md <<'EOF'
                  ---
                  title: Friends
                  ---
                  EOF

                  cat > src/content/spec/projects.md <<'EOF'
                  ---
                  title: Projects
                  ---
                  EOF

            - name: Test Build
              run: pnpm run build
              env:
                  ENABLE_CONTENT_SYNC: false

    deploy:
        name: 🚀 远程部署 (Remote Deploy)
        needs: check-and-build
        runs-on: ubuntu-latest

        steps:
            - name: Remote SSH Command
              uses: appleboy/ssh-action@v1.2.5
              with:
                  host: ${{ secrets.SERVER_HOST }}
                  username: ${{ secrets.SERVER_USER }}
                  key: ${{ secrets.SERVER_SSH_KEY }}
                  script: |
                      set -e

                      cd /root/Mizuki

                      git pull origin master

                      if [ -d "content" ]; then
                        cd content
                        git pull origin master
                        cd ..
                      fi

                      export DOCKER_BUILDKIT=1
                      export COMPOSE_DOCKER_CLI_BUILD=1

                      docker compose up -d --build

                      docker image prune -f
