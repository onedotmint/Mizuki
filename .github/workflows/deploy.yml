name: CI/CD Pipeline

on:
    push:
        branches: [master]
    repository_dispatch:
        types: [content-updated]
    workflow_dispatch:

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
    check-and-build:
        name: 🛡️ 预检阶段 (Build Check)
        runs-on: ubuntu-latest

        steps:
            - name: Checkout Code
              uses: actions/checkout@v4.2.2

            - name: Setup pnpm
              uses: pnpm/action-setup@v4.1.0
              with:
                  version: 10.33.0
                  run_install: false

            - name: Setup Node.js 24
              uses: actions/setup-node@v4.3.0
              with:
                  node-version: 24
                  cache: pnpm

            - name: Install & Prepare Mock Content
              run: |
                  pnpm install --no-frozen-lockfile

                  # 1. 创建占位文章
                  mkdir -p src/content/posts
                  echo "---
                  title: Placeholder
                  published: 2026-01-01
                  description: Placeholder
                  image: ''
                  tags: []
                  category: Placeholder
                  draft: false
                  ---
                  Content" > src/content/posts/placeholder.md

                  # 2. 创建所有可能用到的 spec 页面占位符
                  mkdir -p src/content/spec
                  echo "---
                  title: About
                  ---" > src/content/spec/about.md

                  echo "---
                  title: Friends
                  ---" > src/content/spec/friends.md

                  echo "---
                  title: Projects
                  ---" > src/content/spec/projects.md

            - name: Test Build
              run: pnpm run build
              env:
                  ENABLE_CONTENT_SYNC: false

    deploy:
        name: 🚀 远程部署 (Remote Deploy)
        needs: check-and-build
        runs-on: ubuntu-latest
        steps:
            - name: Remote SSH Command
              uses: appleboy/ssh-action@v1.2.0
              with:
                  host: ${{ secrets.SERVER_HOST }}
                  username: ${{ secrets.SERVER_USER }}
                  key: ${{ secrets.SERVER_SSH_KEY }}
                  script: |
                      cd /root/Mizuki
                      git pull origin master
                      if [ -d "content" ]; then
                        cd content && git pull origin master && cd ..
                      fi
                      docker compose up -d --build
                      docker image prune -f
