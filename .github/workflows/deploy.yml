name: CI/CD Pipeline

on:
    push:
        branches: [master]
    repository_dispatch:
        types: [content-updated]
    workflow_dispatch:

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
    check-and-build:
        name: 🛡️ 预检阶段 (Build Check)
        runs-on: ubuntu-latest

        steps:
            - name: Checkout Code
              uses: actions/checkout@v5

            - name: Install pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 10.33.0

            - name: Setup Node.js 24
              uses: actions/setup-node@v5
              with:
                  node-version: 24
                  cache: pnpm

            - name: Install & Prepare Mock Content
              run: |
                  pnpm install --no-frozen-lockfile

                  mkdir -p src/content/posts src/content/spec

                  # 💡 改用 printf 配合单引号，避开 IDE 的 YAML 解析检测
                  printf -- "---\ntitle: Placeholder\npublished: 2026-01-01\ndescription: Placeholder\nimage: ''\ntags: []\ncategory: Placeholder\ndraft: false\n---\nContent" > src/content/posts/placeholder.md

                  for page in about friends projects; do
                    printf -- "---\ntitle: Page\n---" > src/content/spec/$page.md
                  done

            - name: Test Build
              run: pnpm run build
              env:
                  ENABLE_CONTENT_SYNC: false

    deploy:
        name: 🚀 远程部署 (Remote Deploy)
        needs: check-and-build
        runs-on: ubuntu-latest
        steps:
            - name: Remote SSH Command
              uses: appleboy/ssh-action@v1.2.5
              with:
                  host: ${{ secrets.SERVER_HOST }}
                  username: ${{ secrets.SERVER_USER }}
                  key: ${{ secrets.SERVER_SSH_KEY }}
                  script: |
                      set -e
                      cd /root/Mizuki
                      git pull origin master
                      if [ -d "content" ]; then
                        cd content && git pull origin master && cd ..
                      fi
                      export DOCKER_BUILDKIT=1
                      export COMPOSE_DOCKER_CLI_BUILD=1
                      docker compose up -d --build
                      docker image prune -f
