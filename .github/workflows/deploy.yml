name: CI/CD Pipeline

on:
    push:
        branches: [master]
    repository_dispatch:
        types: [content-updated]
    workflow_dispatch:

jobs:
    # 阶段 1：预检 (CI)
    check-and-build:
        name: 🛡️ 预检阶段 (Build Check)
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Setup Node.js 24
              uses: actions/setup-node@v4
              with:
                  node-version: 24 # 使用你想用的版本

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  run_install: false

            - name: Install & Test Build
              run: |
                  pnpm install --no-frozen-lockfile
                  pnpm run build
              env:
                  ENABLE_CONTENT_SYNC: false # 预检不需要拉取全部博文，只查语法

    # 阶段 2：远程部署 (CD)
    deploy:
        name: 🚀 部署阶段 (Remote Deploy)
        needs: check-and-build # 👈 关键：只有上面的任务成功，这一步才会启动
        runs-on: ubuntu-latest
        steps:
            - name: Remote SSH Command
              uses: appleboy/ssh-action@v1.0.3
              with:
                  host: ${{ secrets.SERVER_HOST }}
                  username: ${{ secrets.SERVER_USER }}
                  key: ${{ secrets.SERVER_SSH_KEY }}
                  script: |
                      cd /root/Mizuki
                      git pull origin master
                      if [ -d "content" ]; then
                        cd content && git pull origin master && cd ..
                      fi
                      docker compose up -d --build
                      docker image prune -f
